     SHARED HEAD / NAV / FOOTER REFERENCE
     --------------------------------------------------------------------------
     This file is documentation, not a runtime include. Every page in this theme
     is a complete, standalone HTML document (no build step, no server render),
     so the blocks below are duplicated into each page verbatim.

     If you later move this theme onto a templating engine (Nunjucks, Eleventy,
     Astro, Laravel Blade, Next…), these are the five partials to extract:

       2. #sprite                 — inline SVG icon sprite
       3. .nav + .drawer          — primary navigation & mobile drawer
       4. .footer                 — global footer
       5. script tags             — CDN + local JS, always last in <body>

     Search any page for the banner comments (e.g. "<!-- NAV -->") to find them.
